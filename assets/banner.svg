    <path d="M0 35 L110 81 L0 127 L-110 81 Z" fill="#FFC700" opacity="0.6"/>
    <path d="M0 0 L110 46 L0 92 L-110 46 Z" fill="#FFC700"/>
    <text x="0" y="58" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="38" font-weight="700" fill="#0a0a0a">&lt;/&gt;</text>
  </g>
  <text x="340" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF">Leandro Tadeu</text>
  <text x="342" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#d0d0d0">Desenvolvimento de SaaS sob medida</text>
  <!-- chips dos planos -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="342" y="210" width="150" height="44" rx="22" fill="none" stroke="#FFC700" stroke-width="2"/>
    <text x="417" y="240" text-anchor="middle" fill="#FFC700">STARTER</text>
    <rect x="508" y="210" width="110" height="44" rx="22" fill="#FFC700" fill-opacity="0.55"/>
    <text x="563" y="240" text-anchor="middle" fill="#0a0a0a">PRO</text>
    <rect x="634" y="210" width="190" height="44" rx="22" fill="#FFC700"/>
    <text x="729" y="240" text-anchor="middle" fill="#0a0a0a">ENTERPRISE</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#FFC700" fill-opacity="0.55" text-anchor="end">
